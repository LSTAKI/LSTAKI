<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-grad)" />
  <rect width="1000" height="240" rx="16" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="50" r="100" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="850" cy="190" r="120" fill="#a855f7" opacity="0.12" filter="url(#glow)" />

  <!-- Terminal Style Top Dots -->
  <circle cx="35" cy="30" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="55" cy="30" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="75" cy="30" r="6" fill="#10b981" opacity="0.8" />

  <!-- Code Decorative Icon -->
  <text x="940" y="42" font-family="Consolas, Fira Code, monospace" font-size="20" fill="#a855f7" opacity="0.4" text-anchor="end">&lt;/&gt;</text>

  <!-- Main Name -->
  <text x="500" y="115" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    TAKI ALTAF MULLA
  </text>

  <!-- Gradient Divider Line -->
  <rect x="250" y="135" width="500" height="3" rx="1.5" fill="url(#accent-grad)" />

  <!-- Subtitle -->
  <text x="500" y="175" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="17" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.5">
    CSE (AI &amp; DS) @ VTU Belagavi  •  Competitive Programmer  •  Full-Stack &amp; AI Systems
  </text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="234" width="1000" height="6" rx="3" fill="url(#accent-grad)" />
</svg>
